<style>
:root{--pri:#1d4ed8;--pri2:#dbeafe;--ok:#15803d;--ok2:#dcfce7;--bad:#b91c1c;--bad2:#fee2e2;--warn:#b45309;--warn2:#fef3c7;--bd:#e2e8f0;--mut:#64748b;--bg:#f1f5f9}
*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun',system-ui,sans-serif;font-size:15px;color:#0f172a;background:var(--bg)}
button,input,select,textarea{font-family:inherit;font-size:15px}
input,select,textarea{padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;max-width:100%}
textarea{width:100%;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid #93c5fd;border-color:var(--pri)}
label{display:inline-flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
label.chk{flex-direction:row;align-items:center;gap:8px;cursor:pointer}
label.chk input{width:20px;height:20px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--pri);border:1px solid #bfdbfe}
.btn.red{background:var(--bad)}.btn.green{background:var(--ok)}
.btn.sm{padding:5px 10px;font-size:13px}.btn.full{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:8px 0}.row.end{justify-content:flex-end}
.muted{color:var(--mut);font-size:13px}
h2{margin:0 0 14px;font-size:22px}h3{margin:0 0 10px;font-size:18px}h4{margin:0 0 8px;font-size:15px;color:#334155}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:800px){.grid2,.grid3{grid-template-columns:1fr}}
/* layout */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#1e3a8a,#2563eb)}
.lbox{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.lbox h1{font-size:20px;margin:0;text-align:center}.lbox label{width:100%}.lbox input{width:100%}
.roles{display:flex;gap:6px}.roles label{flex:1;flex-direction:row;justify-content:center;align-items:center;border:1px solid #cbd5e1;border-radius:8px;padding:8px;cursor:pointer;font-weight:600}
.roles input{display:none}.roles label:has(input:checked){background:var(--pri);color:#fff;border-color:var(--pri)}
header{position:sticky;top:0;z-index:20;background:#1e3a8a;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
header .t{font-weight:800;font-size:17px;flex:1}header .r{font-size:13px;background:#ffffff22;padding:3px 10px;border-radius:20px}
#burger{display:none;background:none;border:0;color:#fff;font-size:24px;cursor:pointer}
.wrap{display:flex;min-height:calc(100vh - 52px)}
nav{width:250px;background:#fff;border-right:1px solid var(--bd);padding:10px 0;flex-shrink:0}
nav .g{font-size:12px;color:var(--mut);padding:12px 18px 4px;font-weight:800;text-transform:uppercase}
nav a{display:block;padding:9px 18px;color:#0f172a;text-decoration:none;cursor:pointer;border-left:3px solid transparent}
nav a:hover{background:#f8fafc}nav a.on{background:var(--pri2);border-left-color:var(--pri);font-weight:700;color:var(--pri)}
main{flex:1;padding:20px;min-width:0;max-width:1200px}
@media(max-width:960px),(max-height:500px) and (orientation:landscape){#burger{display:block}nav{position:fixed;top:var(--hdh,52px);bottom:0;left:0;z-index:15;transform:translateX(-100%);transition:.2s;overflow:auto;box-shadow:2px 0 10px #0002}nav.open{transform:none}main{padding:12px}}
/* search */
.search{display:flex;gap:8px;margin-bottom:14px}.search input{flex:1;min-width:0;font-size:20px;padding:12px 14px}.search .btn{font-size:17px}
/* person */
.person{display:flex;gap:14px;align-items:flex-start}
.ph{object-fit:cover;border-radius:8px;border:1px solid var(--bd);background:#f8fafc;flex-shrink:0}
.ph.xl{width:150px;height:190px}.ph.lg{width:110px;height:140px}.ph.md{width:72px;height:90px}.ph.sm{width:44px;height:55px;border-radius:5px}
.nophoto{display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:12px;text-align:center;border-style:dashed}
.kv{border-collapse:collapse}.kv th{text-align:left;color:var(--mut);font-weight:600;padding:3px 12px 3px 0;white-space:nowrap;vertical-align:top}.kv td{padding:3px 0;font-weight:600}
.block{border:1px solid var(--bd);border-radius:10px;padding:12px;background:#fff;break-inside:avoid}
.plist{display:flex;flex-direction:column;gap:10px}
.pitem{display:flex;gap:10px;align-items:flex-start}.pitem .n{font-weight:700}.pitem .s{font-size:13px;color:var(--mut)}
/* tables */
.scroll{overflow:auto}
table.t{border-collapse:collapse;width:100%;background:#fff}
table.t th,table.t td{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:middle}
table.t th{background:#f8fafc;font-size:13px;white-space:nowrap}
table.t td.c,table.t th.c{text-align:center}table.t td.r,table.t th.r{text-align:right}
table.t tr.sub td{background:#fafafa;font-size:13px}table.t tr.grp td{border-top:2px solid #94a3b8}
table.t tfoot td{font-weight:800;background:#f8fafc}
.pos h4{color:var(--ok)}.neg h4{color:var(--bad)}
.pos table.t th{background:var(--ok2)}.neg table.t th{background:var(--bad2)}
.big-num{font-size:26px;font-weight:800}
/* banners */
.banner{border-radius:10px;padding:12px 14px;font-weight:700;margin-bottom:12px;font-size:17px}
.banner.ok{background:var(--ok2);color:var(--ok)}.banner.bad{background:var(--bad2);color:var(--bad)}.banner.warn{background:var(--warn2);color:var(--warn)}.banner.info{background:var(--pri2);color:var(--pri)}
.chip{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700}
.chip.ok{background:var(--ok2);color:var(--ok)}.chip.bad{background:var(--bad2);color:var(--bad)}.chip.info{background:var(--pri2);color:var(--pri)}.chip.warn{background:var(--warn2);color:var(--warn)}
/* topics buttons */
.tbtns{display:flex;flex-wrap:wrap;gap:8px}
.tbtn{border:2px solid;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700;background:#fff;text-align:left}
.tbtn.p{border-color:#86efac;color:var(--ok)}.tbtn.p:hover{background:var(--ok2)}
.tbtn.n{border-color:#fca5a5;color:var(--bad)}.tbtn.n:hover{background:var(--bad2)}
.tbtn b{display:block;font-size:18px}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--bd);margin-bottom:14px}
.tabs button{background:none;border:0;padding:10px 16px;cursor:pointer;font-weight:700;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
/* mapping */
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:12px}
.mapgrid label select{width:100%}
.pgroup{border:1px dashed #93c5fd;border-radius:10px;padding:10px;margin-bottom:10px;background:#f8fbff}
.pgroup .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:700}
/* report */
.rep{background:#fff;padding:18px;border-radius:12px;border:1px solid var(--bd)}
.rhead{text-align:center;margin-bottom:14px;border-bottom:2px solid #0f172a;padding-bottom:8px}
.rhead .s1{font-size:18px;font-weight:800}.rhead .s2{font-size:16px;font-weight:700}.rhead .s3{font-size:12px;color:var(--mut)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.sumbox{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.sumbox div{flex:1;min-width:140px;border-radius:10px;padding:10px;text-align:center;font-weight:700}
/* late card 5.6 x 8.8 cm */
.lcard{width:56mm;height:87.6mm;box-sizing:border-box;border:1px solid #334155;padding:2mm 2.4mm;font-size:6.8pt;line-height:1.22;background:#fff;color:#000;overflow:hidden;display:flex;flex-direction:column;gap:.9mm;font-family:'Sarabun',sans-serif}
.lc-head{text-align:center;border-bottom:1px solid #94a3b8;padding-bottom:.8mm}
.lc-school{font-size:6.8pt;font-weight:700}.lc-title{font-size:10pt;font-weight:800;color:#b91c1c;line-height:1.1}.lc-date{font-size:6.6pt}
.lc-top{display:flex;gap:2mm;align-items:flex-start}
.lc-photo{width:17mm;height:21.5mm;object-fit:cover;border:1px solid #94a3b8;border-radius:1mm;flex-shrink:0}
.lc-photo.nophoto{font-size:6pt}
.lc-st{font-size:6.8pt}.lc-st b{font-size:7.6pt;display:block}
.lc-time{border:1.6px solid #dc2626;border-radius:1.6mm;text-align:center;color:#dc2626;padding:.4mm 0 .6mm}
.lc-time span{font-size:6.6pt;font-weight:700}.lc-time b{display:block;font-size:19pt;line-height:1;font-weight:800}
.lc-sec{font-size:6.3pt}.lc-sec i{font-style:normal;font-weight:700}
.lc-sign{margin-top:auto;text-align:center;font-size:6.2pt;line-height:1.15}
.lc-sign img{height:8.5mm;max-width:32mm;object-fit:contain;display:block;margin:0 auto}
.lc-nosign{height:8.5mm;display:flex;align-items:flex-end;justify-content:center;color:#64748b}
.cardwrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
/* overlays */
#loading{position:fixed;inset:0;background:#0f172a55;z-index:100;display:flex;align-items:center;justify-content:center}
#loading div{background:#fff;padding:16px 26px;border-radius:12px;font-weight:700}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:110;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:#0f172a;color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;box-shadow:0 4px 14px #0003}
#toast div.err{background:var(--bad)}#toast div.ok{background:var(--ok)}
#modal{position:fixed;inset:0;background:#0f172a77;z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}
.mbox{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:460px;position:relative}
.mbox.wide{max-width:760px}
.mclose{position:absolute;top:8px;right:10px;background:none;border:0;font-size:26px;cursor:pointer;color:var(--mut)}
.mmsg{white-space:pre-wrap;font-size:16px}
.lbox{position:relative}
.bellmsg{text-align:center;font-size:13px;font-weight:700;color:var(--bad);background:var(--bad2);border-radius:20px;padding:4px 12px;align-self:center;cursor:pointer}
.bell{background:none;border:0;font-size:26px;cursor:pointer;position:absolute;top:12px;right:14px;line-height:1}
.bell.hd{position:relative;top:auto;right:auto;font-size:22px}
.bell .badge{position:absolute;top:-6px;right:-10px;background:#dc2626;color:#fff;border-radius:20px;font-size:12px;font-weight:800;padding:1px 6px;min-width:20px;text-align:center}
.bell.ring{animation:ring 1.2s ease-in-out infinite}
@keyframes ring{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(-14deg)}20%,40%{transform:rotate(14deg)}}
.upslot{flex-direction:column;gap:4px;padding:4px}
.upslot .btn{padding:4px 8px;font-size:12px;margin:2px}
.ph.sm.upslot .btn{padding:2px 6px;font-size:15px;margin:0}
.bulkbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#f8fafc;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin:4px 0 10px}
.bulkbar .grp{display:inline-flex;gap:6px;align-items:center;font-size:14px}.bulkbar input{padding:5px 8px}
.pager{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:6px 0}
.pg{min-width:36px;padding:6px 10px;border:1px solid #cbd5e1;background:#fff;border-radius:8px;cursor:pointer;font-weight:600;color:#334155}
.pg.on{background:var(--pri);border-color:var(--pri);color:#fff}.pg:disabled{opacity:.4;cursor:default}.pgdots{padding:0 4px;color:var(--mut)}
.btn.danger{color:var(--bad);border-color:#fca5a5}
.ver{text-align:center;font-size:12px;color:#94a3b8}
nav .ver{text-align:left;padding:16px 18px 8px;border-top:1px solid var(--bd);margin-top:10px}
.updbar{position:fixed;top:0;left:0;right:0;z-index:120;background:#0f172a;color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:600;box-shadow:0 2px 10px #0004}
.updbar .btn{padding:5px 12px}
.srvwarn{background:var(--warn2);color:var(--warn);font-weight:700;padding:8px 16px;font-size:14px;text-align:center}
.search{flex-wrap:wrap}
.acsel{display:flex;gap:6px}.acsel select{font-size:16px;padding:10px 8px;min-width:96px}
.search{position:relative}
.acwrap{flex:1;min-width:220px;display:flex}
@media(max-width:600px){.acwrap{min-width:0}
 .aci{flex-wrap:wrap;gap:2px 10px}.acid{min-width:0}.acnm{flex:1 1 calc(100% - 90px)}.accr{margin-left:auto}}.acwrap input{flex:1;min-width:0}
.acl{position:absolute;top:100%;left:0;right:0;z-index:30;background:#fff;border:1px solid #cbd5e1;border-radius:10px;margin-top:4px;box-shadow:0 10px 30px #0f172a26;max-height:min(420px,60vh);overflow:auto}
.aci{display:flex;gap:10px;align-items:center;padding:9px 14px;cursor:pointer;border-bottom:1px solid #f1f5f9;font-size:15px}
.aci:hover,.aci.on{background:var(--pri2)}
.acid{font-weight:800;min-width:70px}.acnm{flex:1}.accr{color:var(--mut);font-size:13px;white-space:nowrap}
.acn{padding:8px 14px;font-size:12px;color:var(--mut);background:#f8fafc}
.withstats{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
.sthead{font-weight:800;font-size:16px;color:#0f172a}.sthead small{display:block;font-weight:600;font-size:12px;color:var(--mut)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-left:4px;animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #22c55e99}70%{box-shadow:0 0 0 8px #22c55e00}100%{box-shadow:0 0 0 0 #22c55e00}}
.st-black{background:linear-gradient(135deg,#1f2937,#0f172a)}
.timebar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:14px}
.timebar.back{background:var(--warn2);border-color:#f59e0b;color:#78350f}.timebar.edit{background:#fffbeb;border-color:#fcd34d}
.timebar input{padding:5px 8px}.bdbig{font-size:20px;font-weight:800;color:#b45309}
.scopelab{color:var(--bad);font-weight:800;margin-left:6px}
.st-green{background:linear-gradient(135deg,#16a34a,#15803d)}.st-orange{background:linear-gradient(135deg,#f97316,#ea580c)}.st-pink{background:linear-gradient(135deg,#ec4899,#db2777)}
.st-yellow{background:linear-gradient(135deg,#facc15,#eab308);color:#422006!important}.st-yellow .stbar{background:#42200622}.st-yellow .stbar i{background:#422006}
.stb{border-radius:16px;padding:12px 16px;color:#fff;box-shadow:0 4px 14px #0f172a1f;min-width:0;overflow:hidden}
.stt{font-size:15px;font-weight:700;opacity:.95;line-height:1.2}
.stn{font-size:56px;font-weight:800;line-height:1.05}.stn small{font-size:20px;font-weight:700}
.sts{font-size:18px;font-weight:600;line-height:1.25}.sts b{font-size:28px}
.stbar{height:7px;background:#ffffff44;border-radius:6px;margin-top:6px;overflow:hidden}.stbar i{display:block;height:100%;background:#fff;border-radius:6px}
/* คอม: 5 บล็อกเรียงแนวตั้ง สูงไม่เกินจอ */
.stats{position:sticky;top:66px;display:flex;flex-direction:column;gap:8px;height:calc(100vh - 140px);max-height:calc(100vh - 140px);min-height:420px}
.stats .stb{flex:1 1 0;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:6px 14px}
.stats .stt{font-size:clamp(12px,1.75vh,15px)}
.stats .stn{font-size:clamp(24px,4.8vh,56px)}.stats .stn small{font-size:clamp(12px,1.9vh,20px)}
.stats .sts{font-size:clamp(11px,1.8vh,18px)}.stats .sts b{font-size:clamp(14px,2.6vh,28px)}
.stats .stbar{height:clamp(4px,.7vh,7px);margin-top:clamp(2px,.6vh,6px);flex:0 0 auto}
/* มือถือแนวตั้ง: ดำกึ่งกลางแถวบน / เหลือง+เขียว / ส้ม+ชมพู */
@media(max-width:1000px) and (orientation:portrait){
  .withstats{grid-template-columns:minmax(0,1fr)}.wsmain{min-width:0}
  .stats{position:static;order:-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;height:auto;max-height:none;min-height:0}
  .stats .sthead{grid-column:1/-1;order:0}
  .stats .st-black{grid-column:1/-1;justify-self:center;width:calc(50% - 4px);order:1}
  .stats .st-yellow{order:2}.stats .st-green{order:3}.stats .st-orange{order:4}.stats .st-pink{order:5}
  .stats .stb{padding:9px 11px;border-radius:13px}
  .stats .stt{font-size:clamp(11px,3.3vw,14px)}
  .stats .stn{font-size:clamp(28px,9vw,44px)}.stats .stn small{font-size:clamp(11px,3.4vw,16px)}
  .stats .sts{font-size:clamp(11px,3.2vw,15px)}.stats .sts b{font-size:clamp(14px,4.6vw,22px)}
}
/* มือถือแนวนอน: 5 บล็อกแถวเดียว */
@media(max-width:1000px) and (orientation:landscape),(max-height:500px) and (orientation:landscape){
  .withstats{grid-template-columns:minmax(0,1fr)}.wsmain{min-width:0}
  .stats{position:static;order:-1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;height:auto;max-height:none;min-height:0}
  .stats .sthead{grid-column:1/-1}
  .stats .st-black{width:auto;justify-self:stretch}
  .stats .stb{padding:7px 8px;border-radius:12px;justify-content:flex-start}
  .stats .stt{font-size:clamp(10px,1.5vw,13px);min-height:2.4em}
  .stats .stn{font-size:clamp(22px,3.6vw,38px)}.stats .stn small{font-size:clamp(10px,1.4vw,14px)}
  .stats .sts{font-size:clamp(10px,1.4vw,13px)}.stats .sts b{font-size:clamp(12px,2vw,18px)}
}
.btn.postpone{background:#fff;color:var(--warn);border:1px solid #fcd34d}.btn.postpone.on{background:var(--warn2);border-color:#f59e0b}
#hdSchool,#lgSchool,.rhead .s1,.lc-school,.lc-sign div,.ml{white-space:pre-line}
.applogo{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 4px 8px #1e3a8a33)}
.hdlogo{width:34px;height:34px;object-fit:contain}
.installbox{border:1px dashed #93c5fd;background:#eff6ff;border-radius:10px;padding:10px 12px;font-size:13px;text-align:center;color:#1e3a8a}
.installbox .btn{margin-bottom:4px}
.toolbar{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;margin-bottom:8px}
.toolbar input[type=date]{flex:1 1 auto;min-width:0;max-width:180px}

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const thDate = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${+dd} ${TH_M[+m - 1]} ${+y + 543}`; };
const hm = t => String(t || '').slice(0, 5);
const localStamp = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fullName = o => o ? `${o.prefix || ''}${o.firstName || ''} ${o.lastName || ''}`.trim() : '';
const classRoom = s => `ชั้น ${s.grade || '-'} ห้อง ${s.room || '-'}`;

const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { } } };

let loadingN = 0;
function loading(on) { loadingN = Math.max(0, loadingN + (on ? 1 : -1)); $('#loading').hidden = loadingN === 0; }
function toast(msg, type = '') { const d = document.createElement('div'); d.className = type; d.textContent = msg; $('#toast').appendChild(d); setTimeout(() => d.remove(), 3200); }

/* เรียก Apps Script ผ่าน fetch (ใช้ text/plain เพื่อไม่ให้ติด CORS) */
async function rpc(fn, args, token) {
  let r;
  try {
    r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args, token }) });
  } catch (e) { throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ต'); }
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('เซิร์ฟเวอร์ตอบกลับผิดรูปแบบ (ตรวจสอบว่า Deploy เว็บแอปเป็น "ทุกคน" แล้ว)'); }
  if (!j.ok) throw new Error(String(j.error || 'เกิดข้อผิดพลาด').replace(/^(Error|Exception):\s*/, ''));
  return j.result;
}
async function api(fn, ...args) {
  loading(true);
  try { return await rpc(fn, args, S.token); }
  catch (e) {
    if (String(e.message).indexOf('SESSION_EXPIRED') >= 0) { toast('หมดเวลาการเข้าสู่ระบบ กรุณาเข้าสู่ระบบใหม่', 'err'); doLogout(true); }
    throw e;
  } finally { loading(false); }
}
async function safe(fn) { try { await fn(); } catch (e) { if (e && String(e.message).indexOf('SESSION_EXPIRED') < 0) alertBox(e.message || String(e)); } }

function openModal(html, wide) {
  const m = $('#modal');
  m.innerHTML = `<div class="mbox ${wide ? 'wide' : ''}"><button class="mclose" onclick="closeModal()">×</button>${html}</div>`;
  m.hidden = false; return m.firstChild;
}
let MODAL_CLEANUP = null;
function closeModal() { if (MODAL_CLEANUP) { try { MODAL_CLEANUP(); } catch (e) { } MODAL_CLEANUP = null; } const m = $('#modal'); m.hidden = true; m.innerHTML = ''; }
function alertBox(msg, title = 'แจ้งเตือน') { openModal(`<h3>${esc(title)}</h3><p class="mmsg">${esc(msg)}</p><div class="row end"><button class="btn" onclick="closeModal()">ตกลง</button></div>`); }

/* ย่อรูปให้กว้างประมาณ 400px ตามสัดส่วนเดิม */
function resizeImage(file, width = 400, keepPng = false) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('กรุณาเลือกไฟล์รูปภาพ'));
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const w = width, h = Math.round(im.height * width / im.width);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        if (!keepPng) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(im, 0, 0, w, h);
        res(c.toDataURL(keepPng ? 'image/png' : 'image/jpeg', 0.85));
      };
      im.onerror = () => rej(new Error('เปิดไฟล์รูปไม่ได้'));
      im.src = r.result;
    };
    r.onerror = () => rej(new Error('อ่านไฟล์ไม่ได้'));
    r.readAsDataURL(file);
  });
}
function pickImage(cb, opts = {}) {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
  if (opts.capture) i.capture = 'environment';
  i.onchange = () => i.files[0] && safe(async () => cb(await resizeImage(i.files[0], 400, opts.png)));
  i.click();
}
/* ถ่ายรูปด้วยกล้อง (เว็บแคม/กล้องมือถือ) ถ้าเปิดกล้องไม่ได้จะใช้แอปกล้องของเครื่องแทน */
function takePhoto(cb) {
  const fallback = () => pickImage(cb, { capture: true });
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return fallback();
  let stream = null, facing = 'environment';
  openModal(`<h3>ถ่ายรูป</h3><video id="camV" autoplay playsinline muted style="width:100%;max-height:60vh;border-radius:10px;background:#000"></video>
    <div class="row end"><button class="btn ghost" id="camSw">🔄 สลับกล้อง</button><button class="btn ghost" id="camFile">📁 เลือกไฟล์แทน</button><button class="btn" id="camShot">📸 ถ่าย</button></div>`);
  const stop = () => { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; };
  MODAL_CLEANUP = stop;
  const start = async () => { stop(); stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 } }, audio: false }); $('#camV').srcObject = stream; };
  start().catch(() => { closeModal(); fallback(); });
  $('#camSw').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; start().catch(() => toast('สลับกล้องไม่ได้', 'err')); };
  $('#camFile').onclick = () => { closeModal(); pickImage(cb); };
  $('#camShot').onclick = () => {
    const v = $('#camV'); if (!v.videoWidth) return toast('กล้องยังไม่พร้อม', 'err');
    const w = 400, h = Math.round(v.videoHeight * w / v.videoWidth);
    const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(v, 0, 0, w, h);
    const d = c.toDataURL('image/jpeg', 0.85); closeModal(); safe(() => cb(d));
  };
}

/* =================== พิมพ์ / PDF / Excel / แชร์ =================== */
function doPrint(el, card) {
  const pa = $('#printArea'); pa.innerHTML = ''; pa.appendChild(el.cloneNode(true));
  $('#pageStyle').textContent = card ? '@page{size:56mm 88mm;margin:0}' : '@page{size:A4 portrait;margin:10mm}';
  document.body.classList.add('printing');
  setTimeout(() => { window.print(); document.body.classList.remove('printing'); pa.innerHTML = ''; }, 350);
}
function pdfOpts(name, card) {
  return {
    margin: card ? 0 : 8, filename: name + '.pdf', image: { type: 'jpeg', quality: 0.95 },
    html2canvas: { scale: card ? 4 : 2, useCORS: true, backgroundColor: '#ffffff' },
    jsPDF: { unit: 'mm', format: card ? [56, 88] : 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['css', 'legacy'], avoid: ['tr', '.block', '.lcard'] }
  };
}
async function doPdf(el, name, card) { loading(true); try { await html2pdf().set(pdfOpts(name, card)).from(el).save(); } finally { loading(false); } }
function doExcel(aoa, name) {
  const ws = XLSX.utils.aoa_to_sheet(aoa); const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'รายงาน'); XLSX.writeFile(wb, name + '.xlsx');
}
async function doShare(el, name, card) {
  loading(true);
  let uri;
  try { uri = await html2pdf().set(pdfOpts(name, card)).from(el).outputPdf('datauristring'); } finally { loading(false); }
  try {
    const blob = await (await fetch(uri)).blob();
    const file = new File([blob], name + '.pdf', { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const r = await api('createShareLink', uri, name);
  const u = encodeURIComponent(r.url);
  openModal(`<h3>แชร์รายงาน</h3><p class="muted">สร้างไฟล์ PDF ไว้ใน Google Drive แล้ว ส่งลิงก์นี้ให้ผู้รับได้เลย</p>
    <input id="shUrl" value="${esc(r.url)}" readonly style="width:100%">
    ${r.warn ? `<p class="muted" style="color:var(--warn)">${esc(r.warn)}</p>` : ''}
    <div class="row"><button class="btn" id="shCopy">คัดลอกลิงก์</button>
    <a class="btn green" target="_blank" href="https://social-plugins.line.me/lineit/share?url=${u}" style="text-decoration:none">แชร์ทาง LINE</a>
    <a class="btn ghost" target="_blank" href="https://www.facebook.com/sharer/sharer.php?u=${u}" style="text-decoration:none">Facebook</a>
    <a class="btn ghost" target="_blank" href="mailto:?subject=${encodeURIComponent(name)}&body=${u}" style="text-decoration:none">อีเมล</a>
    <a class="btn ghost" target="_blank" href="${esc(r.url)}" style="text-decoration:none">เปิดไฟล์</a></div>`);
  $('#shCopy').onclick = () => { const i = $('#shUrl'); i.select(); try { navigator.clipboard.writeText(i.value).then(() => toast('คัดลอกแล้ว', 'ok'), () => { document.execCommand('copy'); toast('คัดลอกแล้ว', 'ok'); }); } catch (e) { document.execCommand('copy'); toast('คัดลอกแล้ว', 'ok'); } };
}
/** opts: { el: ()=>Element, name, card, excel: ()=>aoa, printLabel } */

/* ดรอปดาวน์ชั้น/ห้อง (ใช้ข้อมูลชั้นห้องจริงในระบบ) */
function fillClassDropdowns(gSel, rSel) {
  const g = gSel.value, r = rSel.value, cls = S.classes || [];
  const grades = [...new Set(cls.map(c => c.grade))];
  const sum = arr => arr.reduce((t, c) => t + c.count, 0);
  gSel.innerHTML = '<option value="">ทุกชั้น</option>' + grades.map(x => `<option value="${esc(x)}" ${x === g ? 'selected' : ''}>${esc(x || '(ไม่ระบุ)')} (${sum(cls.filter(c => c.grade === x))})</option>`).join('');
  const rc = cls.filter(c => !gSel.value || c.grade === gSel.value);
  const rooms = [...new Set(rc.map(c => c.room))].sort((a, b) => String(a).localeCompare(String(b), 'th', { numeric: true }));
  rSel.innerHTML = '<option value="">ทุกห้อง</option>' + rooms.map(x => `<option value="${esc(x)}" ${x === r ? 'selected' : ''}>ห้อง ${esc(x || '(ไม่ระบุ)')} (${sum(rc.filter(c => c.room === x))})</option>`).join('');
}
async function reloadClasses() { try { S.classes = await rpc('listClasses', [], S.token); } catch (e) { } }
/* ค้นหานักเรียน: เลือกชั้น/ห้อง = ค้นหาทันที | พิมพ์รหัส/ชื่อ/นามสกุล/ชั้น/ห้อง แล้วหยุด 1 วินาที = ค้นหาเลย */
function bindSearch(id, fn, opts = {}) {
  const i = $('#' + id), box = $('#' + id + 'Ac'), gSel = $('#' + id + 'G'), rSel = $('#' + id + 'R'), wrap = $('#' + id + 'Wrap');

  }

    if (!g && !r) { rosterEl.innerHTML = '<div class="muted" style="margin-top:12px">เลือกชั้น/ห้องจากดรอปดาวน์เพื่อแสดงรายชื่อนักเรียน หรือพิมพ์ค้นหา</div>'; return; }
    rosterEl.innerHTML = '<div class="muted" style="margin-top:12px">กำลังโหลดรายชื่อ...</div>';
    let res; try { res = await rpc('findStudents', ['', g, r], S.token); } catch (e) { rosterEl.innerHTML = ''; return; }
    if (my !== rosterSeq) return;
    const mine = myScope && myScope();
    const isMine = mine && mine.grade === g && mine.room === r;
    rosterEl.innerHTML = `<div class="roster"><div class="rhd"><b>รายชื่อนักเรียน ${esc(scopeText(g, r))}</b> ${isMine ? '<span class="chip ok">ห้องของฉัน</span>' : ''} <span class="muted">${res.total} คน · คลิกชื่อเพื่อเลือก</span>${stLegend()}</div>
      <div class="rgrid">${res.items.map((s, k) => `<button class="rcell ${s.st ? 'st-' + s.st : ''}" data-rk="${k}" title="${esc(ST_NAME[s.st] || '')}"><span class="rid">${esc(s.studentId)}</span><span class="rnm">${esc(fullName(s))}</span><span class="rcr">${esc(classRoom(s))}${s.hasPhoto ? '' : ' · <b style="color:var(--bad)">ไม่มีรูป</b>'}</span></button>`).join('') || '<span class="muted">ไม่มีนักเรียน</span>'}</div></div>`;
    $$('.rcell', rosterEl).forEach(b => b.onclick = () => { $$('.rcell.on', rosterEl).forEach(x => x.classList.remove('on')); b.classList.add('on'); choose(res.items[+b.dataset.rk]); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  };
  const choose = s => { box.hidden = true; i.value = s.studentId; lastKey = keyNow(); safe(() => fn(s.studentId)); };
  const keyNow = () => i.value.trim() + '|' + gSel.value + '|' + rSel.value;
  const label = () => [i.value.trim(), gSel.value && ('ชั้น ' + gSel.value), rSel.value && ('ห้อง ' + rSel.value)].filter(Boolean).join(' · ');
  const render = () => {
    if (!list.length) { box.innerHTML = `<div class="acn">ไม่พบนักเรียนที่ตรงกับ "${esc(label())}"</div>`; box.hidden = false; return; }
    box.innerHTML = list.map((s, k) => `<div class="aci ${k === hi ? 'on' : ''}" data-k="${k}"><span class="acid">${esc(s.studentId)}</span><span class="acnm">${esc(fullName(s))}</span><span class="accr">${esc(classRoom(s))}</span>${s.st ? `<span class="stdot st-${s.st}" title="${esc(ST_NAME[s.st])}"></span>` : ''}${s.hasPhoto ? '' : '<span class="chip bad" style="font-size:11px">ไม่มีรูป</span>'}</div>`).join('') +

    return true;
  };
  /* ค้นหา: auto = มาจากการหยุดพิมพ์/เลือกดรอปดาวน์ (เปิดทันทีเฉพาะรหัสตรงทุกตัว) | กด Enter/ปุ่ม (พบคนเดียวก็เปิดเลย) */
  const run = async auto => {
    clearTimeout(timer);
    const q = i.value.trim();
    // โหมดรายงานกลุ่ม: ไม่พิมพ์อะไร แล้วกดค้นหา → รายงานตามดรอปดาวน์/ช่วงวันที่
    if (!auto && !q && opts.onGroup) { seq++; box.hidden = true; return safe(() => opts.onGroup(gSel.value, rSel.value)); }
    if (!q && !gSel.value && !rSel.value) { seq++; lastKey = ''; box.hidden = true; if (!auto) toast('พิมพ์รหัส ชื่อ นามสกุล หรือเลือกชั้น/ห้อง', 'err'); return; }
    if (!auto && !box.hidden && navigated && list[hi]) return choose(list[hi]);
    if (auto && keyNow() === lastKey) return;      // ค้นหาเดิมไปแล้ว
    if (!auto) loading(true);
    let ok;
    try { ok = await lookup(); }
    catch (e) { if (!auto) safe(() => { throw e; }); return; }
    finally { if (!auto) loading(false); }
    if (!ok) return;
    lastKey = keyNow();
    const exact = q && list.find(s => s.studentId === q);
    if (exact) return choose(exact);
    if (!auto && list.length === 1) return choose(list[0]);
    render();
  };
  gSel.onchange = () => { fillClassDropdowns(gSel, rSel); i.value = ''; if (opts.onScope) opts.onScope(gSel.value, rSel.value); if (opts.noAutoSelect || rosterEl) { seq++; box.hidden = true; drawRoster(); if (opts.onClass) opts.onClass(gSel.value, rSel.value); } else run(true); };
  rSel.onchange = () => { i.value = ''; if (opts.onScope) opts.onScope(gSel.value, rSel.value); if (opts.noAutoSelect || rosterEl) { seq++; box.hidden = true; drawRoster(); if (opts.onClass) opts.onClass(gSel.value, rSel.value); } else run(true); };
  i.oninput = () => {
    clearTimeout(timer);
    if (!i.value.trim() && !gSel.value && !rSel.value) { seq++; lastKey = ''; box.hidden = true; return; }
    timer = setTimeout(() => run(true), 1000);
  };
  i.onkeydown = e => {
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !box.hidden && list.length) {
      e.preventDefault(); navigated = true;
      hi = (hi + (e.key === 'ArrowDown' ? 1 : -1) + list.length) % list.length; render(); return;
    }
    if (e.key === 'Escape') { box.hidden = true; return; }
    if (e.key === 'Enter') { e.preventDefault(); run(false); }
  };
  i.onfocus = () => { if (list.length) render(); };
  const outside = e => { if (!wrap.isConnected) return document.removeEventListener('mousedown', outside); if (!wrap.contains(e.target)) box.hidden = true; };
  document.addEventListener('mousedown', outside);
  $('#' + id + 'Btn').onclick = () => run(false);
  setTimeout(() => i.focus(), 50);
  drawRoster();
  if (opts.onClass && (gSel.value || rSel.value)) setTimeout(() => opts.onClass(gSel.value, rSel.value), 0);
}

/* =================== แยกชื่อ / คำนำหน้า =================== */
const PREFIXES = ['ว่าที่ร้อยตรีหญิง', 'ว่าที่ร้อยตรี', 'ว่าที่ ร.ต.', 'ว่าที่ร.ต.', 'เด็กชาย', 'เด็กหญิง', 'นางสาว', 'ด.ช.', 'ด.ญ.', 'น.ส.', 'ดร.', 'นาย', 'นาง', 'Mrs.', 'Mr.', 'Ms.', 'Miss'];
function splitName(s) {
  s = String(s || '').trim().replace(/\s+/g, ' ');
  let prefix = '';
  for (const p of PREFIXES) if (s.startsWith(p)) { prefix = p; s = s.slice(p.length).trim(); break; }
  const parts = s.split(' ');
  return { prefix, firstName: parts[0] || '', lastName: parts.slice(1).join(' ') };
}

/* =================== ตัวจับคู่คอลัมน์ (ใช้ร่วม นักเรียน/ครู) =================== */
const PW = /(ผู้ปกครอง|ผปค|บิดา|มารดา|พ่อ|แม่|parent|guardian)/;
const GUESS = {
  studentId: { inc: ['รหัส', 'เลขประจำตัว', 'studentid', 'id'] },
  fullName: { all: ['ชื่อ', 'สกุล'] },
  prefix: { inc: ['คำนำ', 'prefix', 'title'] },
  firstName: { inc: ['ชื่อ', 'first', 'name'], exc: ['สกุล', 'last', 'คำนำ', 'sur'] },
  lastName: { inc: ['สกุล', 'last', 'surname'], exc: ['ชื่อ-', 'ชื่อ–'] },
  classRoom: { all: ['ชั้น', 'ห้อง'] },
  grade: { inc: ['ชั้น', 'grade', 'class', 'ระดับ'], exc: ['ห้อง'] },
  room: { inc: ['ห้อง', 'room'], exc: ['ชั้น'] },
  phone: { inc: ['โทร', 'phone', 'tel', 'มือถือ', 'mobile'] },
  relation: { inc: ['สถานะ', 'ความสัมพันธ์', 'เกี่ยวข้อง', 'relation'], any: true }
};
function guessCol(headers, key, used, pg) {
  const g = GUESS[key]; if (!g) return -1;
  for (let i = 0; i < headers.length; i++) {
    if (used.has(i)) continue;
    const h = String(headers[i] || '').toLowerCase().replace(/\s+/g, ''); if (!h) continue;
    const isP = PW.test(h);
    if (pg === null) { if (isP && !g.anyStudent) { /* คอลัมน์ผู้ปกครอง ข้าม */ continue; } }
    else if (pg >= 0) {
      if (!isP && !g.any) continue;
      const num = h.match(/\d+/);
      if (num ? (+num[0] !== pg + 1) : pg > 0) continue;
    }
    if (g.all && !g.all.every(k => h.includes(k))) continue;
    if (g.inc && !g.inc.some(k => h.includes(k))) continue;
    if (g.exc && g.exc.some(k => h.includes(k))) continue;
    return i;
  }
  return -1;
}
/** cfg: { fields:[[key,label]], parentFields?:[[key,label]], onImport: async rows=>html, extraHtml, noHeaderGuess } */
function Importer(root, cfg) {
  let headers = [], data = [];
  root.innerHTML = `<h4>จับคู่หัวคอลัมน์ (คอลัมน์จาก Excel → ช่องข้อมูลในระบบ)</h4>
    <p class="muted">ระบบเดาให้อัตโนมัติ ตรวจสอบและแก้ไขได้ ช่องที่ไม่มีข้อมูลเลือก "ไม่นำเข้า" ข้อมูลไม่ครบก็นำเข้าได้</p>
    <div class="mapgrid" data-main></div>
    ${cfg.parentFields ? '<div data-pgs></div><button class="btn ghost sm" data-addp>+ เพิ่มชุดคอลัมน์ผู้ปกครองอีกคน</button>' : ''}
    <h4 style="margin-top:16px">ตัวอย่างข้อมูลที่จะนำเข้า (10 แถวแรก)</h4><div class="scroll" data-prev></div>
    <div class="row">${cfg.extraHtml || ''}<button class="btn" data-go>นำเข้าข้อมูล</button></div><div data-res></div>`;
  const colSel = (key, label, sel) => `<label>${esc(label)}<select data-k="${key}"><option value="-1">— ไม่นำเข้า —</option>${headers.map((h, i) => `<option value="${i}" ${i === sel ? 'selected' : ''}>${esc(h || ('คอลัมน์ ' + (i + 1)))}${data[0] && data[0][i] !== undefined && String(data[0][i]).trim() ? ' · เช่น ' + esc(String(data[0][i]).slice(0, 18)) : ''}</option>`).join('')}</select></label>`;
  function renderGroup(container, fields, pg) {
    const used = new Set($$('select[data-k]', root).map(s => +s.value).filter(v => v >= 0));
    const order = ['fullName', 'classRoom'];
    const sel = {};
    order.concat(fields.map(f => f[0]).filter(k => order.indexOf(k) < 0)).forEach(k => {
      if (!fields.some(f => f[0] === k)) return;
      if ((k === 'firstName' || k === 'prefix' || k === 'lastName') && sel.fullName >= 0 && k !== 'lastName') { sel[k] = -1; return; }
      if ((k === 'grade' || k === 'room') && sel.classRoom >= 0) { sel[k] = -1; return; }
      const i = guessCol(headers, k, used, pg); sel[k] = i; if (i >= 0) used.add(i);
    });
    if (cfg.guessNoHeader && (pg === null || pg === -1)) Object.assign(sel, cfg.guessNoHeader(data, sel));
    container.innerHTML = fields.map(f => colSel(f[0], f[1], sel[f[0]])).join('');
  }
  function addParentGroup(idx) {
    const g = document.createElement('div'); g.className = 'pgroup';
    g.innerHTML = `<div class="hd"><span>ผู้ปกครองคนที่ <span class="no"></span></span><button class="btn ghost sm" data-del>ลบชุดนี้</button></div><div class="mapgrid"></div>`;
    $('[data-pgs]', root).appendChild(g);
    renderGroup($('.mapgrid', g), cfg.parentFields, idx);
    $('[data-del]', g).onclick = () => { g.remove(); renumber(); preview(); };
    renumber();
  }
  function renumber() { $$('.pgroup', root).forEach((g, i) => $('.no', g).textContent = i + 1); }
  const readMap = el => { const m = {}; $$('select[data-k]', el).forEach(s => { if (+s.value >= 0) m[s.dataset.k] = +s.value; }); return m; };
  const pick = (r, m) => { const o = {}; for (const k in m) o[k] = String(r[m[k]] == null ? '' : r[m[k]]).trim(); return o; };
  const applyFull = o => { if (o.fullName) { const n = splitName(o.fullName); ['prefix', 'firstName', 'lastName'].forEach(k => { if (!o[k]) o[k] = n[k]; }); } delete o.fullName; return o; };
  const applyCR = o => { if (o.classRoom) { const m = o.classRoom.split(/[\/\-]/); if (!o.grade) o.grade = (m[0] || '').trim(); if (!o.room) o.room = (m[1] || '').trim(); } delete o.classRoom; return o; };
  function build() {
    const mm = readMap($('[data-main]', root));
    const pgs = $$('.pgroup', root).map(g => readMap(g));
    return data.map(r => {
      const main = applyCR(applyFull(pick(r, mm)));
      if (!cfg.parentFields) return main;
      return { student: main, parents: pgs.map(m => applyFull(pick(r, m))) };
    });
  }
  function preview() {
    const rows = build().slice(0, 10);
    const keys = cfg.fields.map(f => f[0]).filter(k => k !== 'fullName' && k !== 'classRoom');
    const lab = Object.fromEntries(cfg.fields);
    const pc = cfg.parentFields ? $$('.pgroup', root).length : 0;
    $('[data-prev]', root).innerHTML = `<table class="t"><thead><tr>${keys.map(k => `<th>${esc(lab[k].replace(' *', ''))}</th>`).join('')}${pc ? Array.from({ length: pc }, (_, i) => `<th>ผู้ปกครอง ${i + 1}</th>`).join('') : ''}</tr></thead><tbody>${rows.map(r => {
      const m = cfg.parentFields ? r.student : r;
      return `<tr>${keys.map(k => `<td>${esc(m[k] || '')}</td>`).join('')}${cfg.parentFields ? r.parents.map(p => `<td>${esc([fullName(p), p.relation ? '(' + p.relation + ')' : '', p.phone].filter(Boolean).join(' '))}</td>`).join('') : ''}</tr>`;
    }).join('')}</tbody></table><p class="muted">ทั้งหมด ${data.length} แถว</p>`;
  }
  root.addEventListener('change', e => { if (e.target.matches('select[data-k]')) preview(); });
  if (cfg.parentFields) $('[data-addp]', root).onclick = () => { addParentGroup($$('.pgroup', root).length); preview(); };
  $('[data-go]', root).onclick = () => safe(async () => {
    const rows = build();
    $('[data-res]', root).innerHTML = await cfg.onImport(rows);
  });
  return {
    load(aoa, headerRow) {
      const width = Math.max(0, ...aoa.map(r => r.length));
      if (headerRow === null) { headers = Array.from({ length: width }, (_, i) => 'คอลัมน์ ' + (i + 1)); data = aoa; }
      else { headers = (aoa[headerRow] || []).map(v => String(v).trim()); while (headers.length < width) headers.push(''); data = aoa.slice(headerRow + 1); }
      data = data.filter(r => r.some(c => String(c).trim()));
      root.hidden = false;
      $('[data-main]', root).innerHTML = '';
      if (cfg.parentFields) $('[data-pgs]', root).innerHTML = '';
      renderGroup($('[data-main]', root), cfg.fields, cfg.parentFields ? null : -1);
      if (cfg.parentFields) {
        const nums = new Set(); headers.forEach(h => { if (PW.test(h)) { const m = h.match(/\d+/); nums.add(m ? +m[0] : 1); } });
        const n = Math.max(1, nums.size);
        for (let i = 0; i < n; i++) addParentGroup(i);
      }
      preview();
    }
  };
}
function excelPicker(prefix) {

function bindExcelPicker(prefix, onAoa) {

function guessTeacherNoHeader(data, sel) {
  const out = {}; const n = Math.max(0, ...data.map(r => r.length)); const used = new Set(Object.values(sel).filter(v => v >= 0));
  const test = (i, re) => { const v = data.slice(0, 20).map(r => String(r[i] || '').trim()).filter(Boolean); return v.length && v.filter(x => re.test(x)).length / v.length > 0.6; };
  const textCols = [];
  for (let i = 0; i < n; i++) {
    if (used.has(i)) continue;
    if (test(i, /^0?\d[\d\- ]{7,11}$/)) { out.phone = i; continue; }
    if (test(i, /^[^\s]*\d+\s*[\/\-]\s*\d+$/)) { out.classRoom = i; out.grade = -1; out.room = -1; continue; }
    if (test(i, /^(ม|ป|อ)\.?\s*\d+$/)) { out.grade = i; continue; }
    if (test(i, /^\d{1,2}$/) && out.grade !== undefined) { out.room = i; continue; }
    if (test(i, /[ก-๙A-Za-z]/)) textCols.push(i);
  }
  if (textCols.length) { out.fullName = textCols[0]; out.prefix = -1; out.firstName = -1; }
  if (textCols.length > 1) out.lastName = textCols[1];
  return out;
}

let REISSUE = null;
function wireApprove(root, after) {
  $$('[data-spcancel]', root).forEach(b => b.onclick = () => safe(async () => {
    if (!await confirmBox('ยกเลิกบัตรระยะยาวใบนี้? ข้อมูลบัตรจะถูกลบออกจากระบบ', 'ยกเลิกบัตร', true)) return;
    const d = await api('cancelSpecialPass', b.dataset.spcancel); toast('ยกเลิกบัตรระยะยาวแล้ว', 'ok'); after(d);
  }));
  $$('[data-cancel]', root).forEach(b => b.onclick = () => safe(async () => {
    if (!await confirmBox('ยกเลิกบัตรใบนี้? ข้อมูลบัตรจะถูกลบออกจากระบบ', 'ยกเลิกบัตร', true)) return;
    const d = await api('cancelPass', b.dataset.cancel); toast('ยกเลิกบัตรแล้ว', 'ok'); refreshBell(); after(d);
  }));
  $$('[data-reissue]', root).forEach(b => b.onclick = () => safe(async () => {
    if (!await confirmBox('ยกเลิกบัตรใบนี้ แล้วออกบัตรใหม่ (ใช้ข้อมูลเดิมให้แก้ไขได้)?', 'ยกเลิกแล้วออกใหม่', true)) return;
    const d = await api('cancelPass', b.dataset.reissue);
    REISSUE = { studentId: d.student.studentId, date: b.dataset.rdate, time: b.dataset.rtime, reason: b.dataset.rreason, type: b.dataset.rtype, end: b.dataset.rend };
    toast('ยกเลิกบัตรเดิมแล้ว — แก้ไขข้อมูลแล้วกดออกบัตรใหม่', 'ok'); refreshBell(); after(d);
  }));
  $$('[data-approve]', root).forEach(b => b.onclick = () => safe(async () => {
    const code = $(`[data-apcode="${b.dataset.approve}"]`, root).value;
    const d = await api('approvePass', b.dataset.approve, code); toast('อนุมัติแล้ว ลายเซ็นปรากฏบนบัตร', 'ok'); refreshBell(); after(d);
  }));
  $$('[data-reject]', root).forEach(b => b.onclick = () => safe(async () => {
    if (!await confirmBox('ไม่อนุญาตออกบัตรใบนี้?', 'ไม่อนุญาต', true)) return;
    await api('rejectPass', b.dataset.reject); toast('บันทึกไม่อนุมัติแล้ว', 'ok'); refreshBell(); after(null);
  }));
}

      $('#cefSave').onclick = () => safe(async () => { const o = { teacherId: t.teacherId }; $$('#cef [data-f]').forEach(i => o[i.dataset.f] = i.value); const l = await api('updateCoAdvisor', o); closeModal(); draw(l); toast('บันทึกแล้ว', 'ok'); });

/* ---------- 7. ตรวจสอบสถานะ ---------- */
function entriesTableHTML(rows) {
  if (!rows.length) return '<p class="muted">ยังไม่มีนักเรียนเข้าสายในวันนี้</p>';
  const typeChip = t => `<span class="chip ${t === 'ไม่ขออนุญาต' ? 'bad' : t === 'มีบัตรอนุญาต' ? 'ok' : 'info'}"${t.indexOf('เด็กวัด') >= 0 ? ' style="background:#fef08a;color:#854d0e"' : ''}>${esc(t)}</span>${t === 'ไม่ขออนุญาต' ? '' : '<div class="muted" style="font-size:11px">ไม่นับมาสาย</div>'}`;
  return `<table class="t"><thead><tr><th>รูป</th><th>รหัส / บทบาท</th><th>คำนำหน้า</th><th>ชื่อ</th><th>นามสกุล</th><th>ชั้น</th><th>ห้อง</th><th>เบอร์โทร</th><th>ประเภท</th><th>เวลาเข้า</th><th class="noprint" data-html2canvas-ignore="true">ลบ</th></tr></thead><tbody>${rows.map((r, i) => {
    const s = r.student, rs = 1 + r.parents.length + r.teachers.length;
    const sub = (lab, p) => `<tr class="sub"><td>${lab}</td><td>${esc(p.prefix)}</td><td>${esc(p.firstName)}</td><td>${esc(p.lastName)}</td><td colspan="2"></td><td>${esc(p.phone)}</td><td colspan="2"></td></tr>`;
    return `<tr class="grp"><td rowspan="${rs}">${stuPhoto(s, 'sm')}</td><td><b>${esc(s.studentId)}</b></td><td>${esc(s.prefix)}</td><td>${esc(s.firstName)}</td><td>${esc(s.lastName)}</td><td>${esc(s.grade)}</td><td>${esc(s.room)}</td><td>${esc(s.phone)}</td><td>${typeChip(r.entry.type)}</td><td><b>${esc(hm(r.entry.time))}</b></td><td rowspan="${rs}" class="noprint c" data-html2canvas-ignore="true">${r.canDelete ? `<button class="btn sm ghost danger" data-delent="${esc(r.entry.entryId)}" data-delname="${esc(fullName(s))}" data-deltype="${esc(r.entry.type)}" title="ลบรายการ">🗑</button>` : ''}</td></tr>` +
      r.parents.map(p => sub('ผู้ปกครอง' + (p.relation ? ' (' + esc(p.relation) + ')' : ''), p)).join('') +
      r.teachers.map(t => sub('ครูที่ปรึกษา', t)).join('');
  }).join('')}</tbody></table>`;
}
function entriesAoa(d) {
  const a = [['รายการบันทึกเข้าโรงเรียน วันที่ ' + thDate(d.date)], ['รหัส/บทบาท', 'คำนำหน้า', 'ชื่อ', 'นามสกุล', 'ชั้น', 'ห้อง', 'เบอร์โทร', 'ประเภท', 'เวลาเข้า', 'นับเป็นมาสาย']];
  d.rows.forEach(r => {
    const s = r.student; a.push([s.studentId, s.prefix, s.firstName, s.lastName, s.grade, s.room, s.phone, r.entry.type, hm(r.entry.time), r.entry.type === 'ไม่ขออนุญาต' ? 'นับ' : 'ไม่นับ']);
    r.parents.forEach(p => a.push(['ผู้ปกครอง' + (p.relation ? ' (' + p.relation + ')' : ''), p.prefix, p.firstName, p.lastName, '', '', p.phone]));
    r.teachers.forEach(t => a.push(['ครูที่ปรึกษา', t.prefix, t.firstName, t.lastName, '', '', t.phone]));
  });
  return a;
}
/* แสดงห้องที่กำลังดู ต่อท้ายชื่อเมนู/หัวหน้า ตัวสีแดง */
function setScopeLabel(label, page = 'status') {
  $$('.scopelab').forEach(e => e.remove());
  if (!label) return;

/** ห้องที่ครูเป็นที่ปรึกษา → ขอบเขตเริ่มต้น */
function myScope() {
  const m = S.role === 'teacher' ? (S.myRooms || []) : [];
  if (!m.length) return null;
  if (m.length === 1) return { grade: m[0].grade, room: m[0].room, label: scopeText(m[0].grade, m[0].room), mine: true };
  return { rooms: m, label: m.map(x => scopeText(x.grade, x.room)).join(', '), mine: true };

          <button class="btn sm ghost danger" id="scUndo">↩ ยกเลิกรายการนี้ (ค้นหาผิดคน)</button><div class="muted" style="margin-top:4px">ผู้บันทึกยกเลิกได้ภายใน 30 นาที${S.role === 'admin' ? ' (แอดมินยกเลิกได้ตลอด)' : ' หลังจากนั้นแอดมินเท่านั้น'}</div>`;

        $('#scUndo').onclick = () => safe(async () => {
          if (!await confirmBox(`ยกเลิกการบันทึกมาสายของ ${esc(fullName(s))} และคืนคะแนน?`, 'ยกเลิกรายการ', true)) return;
          await api('undoUnauthorizedLate', res.entry.entryId);
          box.innerHTML = '<h4>มาสายโดยไม่ขออนุญาต</h4><div class="banner info" style="margin:0">ยกเลิกรายการแล้ว คืนคะแนนเรียบร้อย</div>';
          toast('ยกเลิกแล้ว', 'ok'); loadTable(); refreshStats();
        });
      } else { box.innerHTML = '<h4>มาสายโดยไม่ขออนุญาต</h4><div class="banner warn" style="margin:0">นักเรียนมีสิทธิ์เข้าสายแล้ว กรุณาค้นหาใหม่</div>'; }

    if ($('#scIn')) $('#scIn').onclick = () => safe(async () => {
      let res = await api('recordEntry', s.studentId, false, curAt());
      if (res.duplicate) { if (!await confirmBox(`วันนี้บันทึกเข้าไปแล้วเวลา ${esc(hm(res.entry.time))} น. ต้องการบันทึกซ้ำหรือไม่?`, 'บันทึกซ้ำ')) return; res = await api('recordEntry', s.studentId, true, curAt()); }
      toast(`บันทึกเข้าโรงเรียนแล้ว เวลา ${hm(res.entry.time)} น.`, 'ok');
      $('#scOut').innerHTML = `<div class="banner ok">บันทึกเข้าโรงเรียน: ${esc(fullName(s))} (${esc(classRoom(s))}) เวลา ${esc(hm(res.entry.time))} น. <button class="btn sm ghost danger" id="scDelIn" style="margin-left:8px">🗑 ลบรายการนี้</button><div class="muted" style="font-weight:400;font-size:13px">ผู้บันทึกลบได้ภายใน 30 นาที หลังจากนั้นแอดมินเท่านั้นที่ลบได้</div></div>`;
      $('#scDelIn').onclick = () => safe(async () => { if (!await confirmBox('ลบรายการบันทึกเข้านี้?', 'ลบ', true)) return; await api('deleteEntry', res.entry.entryId); $('#scOut').innerHTML = '<div class="banner info">ลบรายการแล้ว</div>'; loadTable(); refreshStats(); });
      $('#scQ').value = ''; $('#scQ').focus(); $('#scDate').value = res.entry.date; loadTable(); refreshStats();
    });
    if ($('#scUn')) $('#scUn').onclick = () => safe(async () => {
      if (!await confirmBox(`ยืนยันบันทึก ${esc(fullName(s))} มาสายโดยไม่ขออนุญาต และหักคะแนน ${esc(lateTopic())}?`, 'บันทึกและหักคะแนน', true)) return;
      await unauthorized(s, $('#scOut'));
      $('#scQ').value = ''; $('#scQ').focus(); loadTable();
    });
  }, { onScope: (g, r) => setScope(g, r) });
  drawTime();
  if (curAt()) $('#scDate').value = curAt().date;
  // ครู: เริ่มต้นแสดงห้องที่ตนเป็นที่ปรึกษา
  const mine = myScope();
  if (mine) { STATS_SCOPE = mine; setScopeLabel(mine.label); refreshStats(); }
  loadTable();
};
async function unauthorized(s, outEl) {
  let r = await api('recordUnauthorizedLate', s.studentId, false, curAt());
  if (r.hasPermission) { if (!await confirmBox(`นักเรียนคนนี้${r.hasPass ? 'มีบัตรอนุญาต' : 'แจ้งครูที่ปรึกษา'}สำหรับวันนี้แล้ว ควรใช้เมนู "ตรวจสอบสถานะ / บันทึกเข้า"\nยังต้องการบันทึกเป็น "ไม่ขออนุญาต" และหักคะแนนหรือไม่?`, 'บันทึกและหักคะแนน', true)) return false; r = await api('recordUnauthorizedLate', s.studentId, true, curAt()); }
  else if (r.duplicate) { if (!await confirmBox(`วันนี้บันทึกมาสายไม่ขออนุญาตไปแล้วเวลา ${esc(hm(r.entry.time))} น. ต้องการบันทึกซ้ำ (หักคะแนนอีกครั้ง) หรือไม่?`, 'บันทึกซ้ำ', true)) return false; r = await api('recordUnauthorizedLate', s.studentId, true, curAt()); }
  outEl.innerHTML = `<div class="banner bad">บันทึกแล้ว: ${esc(fullName(s))} (${esc(classRoom(s))}) มาสายโดยไม่ขออนุญาต วันที่ ${esc(thDate(r.entry.date))} เวลา ${esc(hm(r.entry.time))} น. · หักคะแนน ${esc(r.points)}</div>`;
  toast('บันทึกและหักคะแนนแล้ว', 'ok'); refreshStats();
  return true;
}

  $('#ptAdd').onclick = () => { $('#ptTbl tbody').insertAdjacentHTML('beforeend', ptRow({})); const b = $$('#ptTbl [data-pdel]').pop(); b.onclick = () => b.closest('tr').remove(); };
  $('#sfSave').onclick = () => safe(async () => {
    const o = {}; $$('[data-f]', pg).forEach(i => o[i.dataset.f] = i.value);
    const pts = $$('#ptTbl tbody tr').map(tr => ({ name: $('[data-pn]', tr).value.trim(), long: $('[data-pl]', tr).value === '1', yellow: $('[data-py]', tr).value === '1' })).filter(x => x.name);
    if (!pts.length) throw new Error('ต้องมีประเภทผู้ได้บัตรอย่างน้อย 1 ประเภท');
    o.passTypes = JSON.stringify(pts); S.passTypes = pts;
    o.backdateRoles = ['admin'].concat($$('[data-bdr]', pg).filter(c => c.checked).map(c => c.dataset.bdr)).join(',');
    S.backdateMinutes = Number(o.backdateMinutes) || S.backdateMinutes;
    S.school = await api('saveSettings', o); $('#hdSchool').textContent = S.school; toast('บันทึกแล้ว', 'ok');
  });
  const drawLrs = r => {
    $('#lrsBody').outerHTML = `<div id="lrsBody"><p>ตอนนี้นับมาสาย: <b>${r.start ? 'ตั้งแต่ ' + esc(thDate(r.start)) : 'ทั้งหมด (ยังไม่เคยล้าง)'}</b></p>
      <div class="row" style="align-items:flex-end"><label>เริ่มนับใหม่ตั้งแต่วันที่<input type="date" id="lrsDate" value="${esc(r.today)}"></label>
      ${r.rounds.map(x => `<button class="btn sm red" data-lrs="${esc(x)}">ล้าง${esc(x)}</button>`).join('')}</div>
      ${r.history.length ? `<table class="t" style="margin-top:10px"><thead><tr><th>รอบ</th><th>เริ่มนับใหม่ตั้งแต่</th><th>ล้างโดย</th><th>เมื่อ</th></tr></thead><tbody>${r.history.slice(0, 10).map(h => `<tr><td>${esc(h.round)}</td><td>${esc(thDate(h.date))}</td><td>${esc(h.by)}</td><td>${esc(h.at)}</td></tr>`).join('')}</tbody></table>
      <div class="row" style="margin-top:6px"><button class="btn sm ghost" id="lrsUndo">ยกเลิกการล้างครั้งล่าสุด</button></div>` : ''}</div>`;
    $$('[data-lrs]', pg).forEach(b => b.onclick = () => safe(async () => {
      const d = $('#lrsDate').value || r.today;
      if (!await confirmBox(`ล้างจำนวนครั้งมาสาย${esc(b.dataset.lrs)}? ระบบจะเริ่มนับมาสายใหม่ตั้งแต่วันที่ ${esc(thDate(d))} และคืนคะแนนที่หักจากมาสายก่อนวันนั้น (ประวัติยังเก็บไว้)`, 'ล้าง' + b.dataset.lrs, true)) return;
      drawLrs(await api('resetLateCount', b.dataset.lrs, d)); toast('ล้างแล้ว เริ่มนับมาสายใหม่', 'ok');
    }));
    const u = $('#lrsUndo'); if (u) u.onclick = () => safe(async () => {
      if (!await confirmBox('ยกเลิกการล้างครั้งล่าสุด? จำนวนครั้งมาสายและคะแนนจะกลับไปนับตามรอบก่อนหน้า', 'ยกเลิกการล้าง', true)) return;
      drawLrs(await api('undoLateReset')); toast('ยกเลิกการล้างแล้ว', 'ok');
    });
  };
  safe(async () => drawLrs(await api('lateResetInfo')));
  $('#sigUp').onclick = () => pickImage(async d => { const u = await api('uploadSignature', d); $('#sigPrev').innerHTML = `<img src="${u}" style="max-height:90px">`; toast('อัปโหลดลายเซ็นแล้ว', 'ok'); }, { png: true });
};

/* =================== กระดิ่งแจ้งเตือนคำขอทำบัตร =================== */
function updateBell(n) {
  [['#lgBell', '#lgBellN'], ['#hdBell', '#hdBellN']].forEach(([b, c]) => { $(c).textContent = n; $(b).classList.toggle('ring', n > 0); });
  $('#lgBell').hidden = !(n > 0);
  $('#hdBell').hidden = !(S.role === 'admin' && n > 0);
  const m = $('#lgBellMsg'); m.hidden = !(n > 0);
  m.textContent = `🔔 มีคำขอทำบัตร ${n} รายการ รออนุมัติ`;
  const a = $('#nav a[data-p="approvals"]'); if (a) a.textContent = '🔔 อนุมัติบัตรเข้าสาย' + (n > 0 ? ` (${n})` : '');
}
async function refreshBell() {
  try {
    const r = await rpc('publicInfo', [], null);
    updateBell(r.pendingCount); if (!S.token) $('#lgSchool').textContent = r.schoolName;
    SERVER_VER = r.serverVersion || '';
    showVersions();
  } catch (e) { }
}

/* =================== เวอร์ชัน / อัปเดตอัตโนมัติ =================== */
let SERVER_VER = '', UPD_LATER = '', UPD_TIMER = null;
const cmpVer = (a, b) => { const x = String(a || '0').split('.').map(Number), y = String(b || '0').split('.').map(Number); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0); } return 0; };
const verText = () => `เวอร์ชัน ${APP_VERSION}${SERVER_VER ? ' · เซิร์ฟเวอร์ ' + SERVER_VER : ''}`;
function showVersions() {
  $('#lgVer').textContent = verText();
  const nv = $('#nav .ver'); if (nv) nv.textContent = verText();
  // แจ้งแอดมินถ้า Code.gs บนเซิร์ฟเวอร์เก่ากว่าที่หน้าเว็บต้องการ
  let w = $('#srvWarn');
  const old = SERVER_VER !== '' ? cmpVer(SERVER_VER, MIN_SERVER_VERSION) < 0 : false;
  const noVer = SERVER_VER === '';
  if (S.role === 'admin' && (old || noVer)) {
    if (!w) { $('header').insertAdjacentHTML('afterend', '<div class="srvwarn" id="srvWarn"></div>'); w = $('#srvWarn'); }
    w.textContent = `⚠ Code.gs บนเซิร์ฟเวอร์${noVer ? 'เป็นเวอร์ชันเก่า (ไม่มีเลขเวอร์ชัน)' : 'เป็นเวอร์ชัน ' + SERVER_VER} ต้องเป็น ${MIN_SERVER_VERSION} ขึ้นไป — วาง Code.gs ใหม่แล้ว Deploy เป็น "เวอร์ชันใหม่"`;
  } else if (w) w.remove();
}
/* เช็ก index.html ล่าสุดบน GitHub ถ้าเลขเวอร์ชันเปลี่ยน → รีโหลดอัตโนมัติ (ยังอยู่ในระบบเหมือนเดิม) */
async function checkUpdate() {
  if (location.protocol === 'file:') return;
  try {
    const url = location.href.split('#')[0].split('?')[0];
    const txt = await (await fetch(url + '?v=' + Date.now(), { cache: 'no-store' })).text();
    const m = txt.match(/const APP_VERSION = '([^']+)'/);
    if (!m || m[1] === APP_VERSION || m[1] === UPD_LATER) return;
    promptUpdate(m[1]);
  } catch (e) { }
}
function promptUpdate(v) {
  const bar = $('#updBar'); if (!bar.hidden) return;
  let sec = 15;
  const busy = () => !$('#modal').hidden || !$('#loading').hidden;
  bar.innerHTML = `🔄 มีเวอร์ชันใหม่ ${esc(v)} — อัปเดตอัตโนมัติใน <b id="updSec">${sec}</b> วินาที <button class="btn green" id="updNow">อัปเดตเลย</button><button class="btn ghost" id="updLater">ภายหลัง</button>`;
  bar.hidden = false;
  const go = () => { clearInterval(UPD_TIMER); store.set('updFrom', APP_VERSION); location.reload(); };
  $('#updNow').onclick = go;
  $('#updLater').onclick = () => { clearInterval(UPD_TIMER); UPD_LATER = v; bar.hidden = true; };
  clearInterval(UPD_TIMER);
  UPD_TIMER = setInterval(() => {
    if (busy()) return;                       // รอให้ทำงานที่ค้างอยู่เสร็จก่อน
    sec--; const e = $('#updSec'); if (e) e.textContent = sec;
    if (sec <= 0) go();
  }, 1000);
}
/* หลังอัปเดตเสร็จ แสดงว่ามีอะไรใหม่ */
function showWhatsNew() {
  const from = store.get('updFrom'), seen = store.get('seenVer');
  store.set('seenVer', APP_VERSION); store.set('updFrom', null);
  if (!seen || seen === APP_VERSION) return;
  const vers = Object.keys(CHANGELOG).filter(v => cmpVer(v, seen) > 0 && cmpVer(v, APP_VERSION) <= 0).sort((a, b) => cmpVer(b, a));
  if (!vers.length) return;
  openModal(`<h3>✨ อัปเดตเป็นเวอร์ชัน ${esc(APP_VERSION)} แล้ว</h3>${vers.map(v => `<h4 style="margin-top:10px">เวอร์ชัน ${esc(v)}</h4><ul style="margin:0;padding-left:20px">${CHANGELOG[v].map(x => `<li>${esc(x)}</li>`).join('')}</ul>`).join('')}<div class="row end"><button class="btn" onclick="closeModal()">ตกลง</button></div>`);
}

/* =================== เข้าสู่ระบบ =================== */
async function startApp() {
  const b = await api('getBootstrap');
  Object.assign(S, { role: b.role, roleName: b.roleName, school: b.schoolName, topics: b.topics, today: b.today, myRooms: b.myRooms || [], passTypes: b.passTypes || [{ name: 'นักเรียนทั่วไป', long: false, yellow: false }], classes: b.classes || [], backdateMinutes: b.backdateMinutes || 10, canBackdate: !!b.canBackdate });
  $('#loginView').hidden = true; $('#appView').hidden = false;
  $('#hdSchool').textContent = S.school; $('#hdRole').textContent = S.roleName;
  renderNav(); updateBell(b.pendingCount); showVersions();
  showPage(S.role === 'admin' ? (b.pendingCount > 0 ? 'approvals' : 'importStudents') : S.role === 'teacher' ? 'behavior' : S.role === 'register' ? 'register' : 'status');
}
function lgRole() { return $('[name=role]:checked').value; }
function setLoginRole() {
  const r = lgRole();
  $('#lgUserW').hidden = $('#lgPwW').hidden = r === 'public';
  $('#lgUserL').textContent = r === 'admin' ? 'ชื่อผู้ใช้' : 'เบอร์โทร';
  $('#lgUser').placeholder = r === 'admin' ? 'admin' : 'เช่น 0812345678';
  $('#lgUser').inputMode = r === 'teacher' ? 'tel' : 'text';
  $('#lgPw').placeholder = r === 'teacher' ? 'ใช้เบอร์โทรเดียวกัน' : '';
  $('#lgHint').textContent = r === 'public' ? 'ไม่ต้องใส่รหัส · ตรวจสอบสถานะเข้าสาย (ไม่มีบัตร/ไม่ได้ขออนุญาต ระบบบันทึกมาสายให้อัตโนมัติ)' : r === 'teacher' ? 'ครูใช้เบอร์โทรเป็นทั้งชื่อผู้ใช้และรหัสผ่าน · ครูใหม่ใช้รหัสลงทะเบียนจากโรงเรียน' : '';
  $('#lgHint').hidden = !$('#lgHint').textContent;
  $('#lgBtn').textContent = r === 'public' ? 'เข้าใช้งาน' : 'เข้าสู่ระบบ';
}
async function doLogin(isPublic) {
  isPublic = isPublic || lgRole() === 'public';
  const user = $('#lgUser').value.trim(), pw = $('#lgPw').value;
  if (!isPublic && (!user || !pw)) return toast('กรุณาใส่ชื่อผู้ใช้และรหัสผ่าน', 'err');
  loading(true);
  try {
    const r = isPublic ? await rpc('loginPublic', [], null) : await rpc('login', [user, pw], null);
    S.token = r.token; store.set('tok', r.token); $('#lgPw').value = '';
  } catch (e) { return alertBox(e.message); }
  finally { loading(false); }
  safe(startApp);
}
function doLogout(silent) {
  if (!silent && S.token) rpc('logout', [], S.token).catch(() => { });
  S.token = null; S.role = null; store.set('tok', null); $('#lgUser').value = '';
  $('#appView').hidden = true; $('#loginView').hidden = false; $('#main').innerHTML = '';
  showVersions(); refreshBell();
}
$('#lgBtn').onclick = () => doLogin(false);
$$('[name=role]').forEach(r => r.onchange = setLoginRole); setLoginRole();
$('#lgBellMsg').onclick = () => { $('label:has(input[value=admin])').click(); $('#lgUser').focus(); };
$('#lgPw').onkeydown = e => { if (e.key === 'Enter') doLogin(false); };
$('#lgUser').onkeydown = e => { if (e.key === 'Enter') $('#lgPw').focus(); };
$('#lgBell').onclick = () => $('#lgBellMsg').click();
$('#hdBell').onclick = () => showPage('approvals');
$('#logoutBtn').onclick = () => doLogout(false);
$('#burger').onclick = () => $('#nav').classList.toggle('open');
/* ความสูงแถบบน (มือถือมี 2 แถว) → ตำแหน่งเมนูด้านข้าง */
const setHdH = () => { const hd = $('header'); if (hd && hd.offsetHeight) document.documentElement.style.setProperty('--hdh', hd.offsetHeight + 'px'); };
window.addEventListener('resize', setHdH); window.addEventListener('orientationchange', () => setTimeout(setHdH, 300));
if (window.ResizeObserver) new ResizeObserver(setHdH).observe($('header'));
/* =================== แอปบนหน้าจอ (PWA) ===================
   ไม่มีปุ่มติดตั้งบนหน้าเว็บ: Chrome/Edge จะแสดงแถบ "ติดตั้งแอป" ของเบราว์เซอร์เองเมื่อเปิดลิงก์
   iPhone/iPad (Safari) ไม่มีแถบนี้ → แสดงคำแนะนำสั้น ๆ ครั้งเดียวต่อเครื่อง */
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function iosHintOnce() {
  if (isStandalone() || !isIOS() || store.get('iosHint')) return;
  store.set('iosHint', '1');
  setTimeout(() => toast('📲 เพิ่มเป็นแอป: กดปุ่ม "แชร์" ของ Safari แล้วเลือก "เพิ่มไปยังหน้าจอโฮม"'), 1500);
}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => { });

setInterval(refreshBell, 60000);
setInterval(checkUpdate, 5 * 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkUpdate(); refreshBell(); } });
(function init() {
  showVersions(); showWhatsNew(); iosHintOnce();
  setTimeout(checkUpdate, 3000);
  refreshBell();
  const t = store.get('tok');
  if (t) { S.token = t; startApp().catch(() => doLogout(true)); }
})();
</script>
</body>
</html>
